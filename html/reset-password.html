<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat kata sandi baru untuk akun NAKESA Anda.">
  <meta name="theme-color" content="#faf9f5">
  <title>Kata Sandi Baru — NAKESA</title>
  <script src="../js/theme.js"></script> <!-- light/dark before the page is drawn -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-setup.js"></script> <!-- shared Tailwind config + components -->
  <script type="module" src="../js/pages/reset-password.js"></script>
</head>
<body>
  <button type="button" class="icon-btn theme-toggle theme-fab" data-theme-toggle></button>
  <div class="page-loader" id="loader" role="status" aria-label="Memuat"><span class="spinner"></span></div>
  <div class="flex min-h-screen flex-col items-center px-4 pb-8 pt-16" id="content" hidden>
    <main class="flex w-full max-w-[420px] flex-1 flex-col justify-center gap-6">
      <a class="flex items-center justify-center gap-2.5 font-serif text-2xl font-semibold text-ink no-underline" href="index.html" aria-label="Beranda NAKESA">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-accent text-lg text-white shadow-sm" aria-hidden="true">✚</span>
        NAKESA
      </a>
      <section class="card grid gap-6 p-6 sm:p-8" id="reset-card" aria-labelledby="auth-title" hidden>
        <header class="text-center">
          <h1 class="text-[1.75rem]" id="auth-title">Buat kata sandi baru</h1>
          <p class="mt-1.5 text-muted">Buat kata sandi baru untuk akun NAKESA Anda.</p>
        </header>
        <form id="reset-form" class="grid gap-4" novalidate>
          <div id="alert" hidden></div>
          <div class="field">
            <label for="password">Kata sandi baru</label>
            <div class="field-control has-toggle">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Buat kata sandi baru" aria-describedby="password-error password-hint" required>
              <button type="button" class="field-toggle" aria-controls="password" aria-pressed="false" aria-label="Tampilkan kata sandi">Lihat</button>
            </div>
            <p class="field-hint" id="password-hint">Minimal 8 karakter.</p>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <div class="field">
            <label for="confirm">Ulangi kata sandi</label>
            <div class="field-control has-toggle">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Ketik ulang kata sandi baru" aria-describedby="confirm-error" required>
              <button type="button" class="field-toggle" aria-controls="confirm" aria-pressed="false" aria-label="Tampilkan kata sandi">Lihat</button>
            </div>
            <p class="field-error" id="confirm-error" hidden></p>
          </div>
          <button type="submit" class="btn btn-primary btn-big" id="submit">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-label">Simpan Kata Sandi</span>
          </button>
        </form>

      </section>
      <section class="card grid gap-6 p-6 sm:p-8" id="expired-card" aria-labelledby="expired-title" hidden>
        <header class="text-center">
          <h1 class="text-[1.75rem]" id="expired-title">Link kedaluwarsa</h1>
          <p class="mt-1.5 text-muted">Link ini tidak valid atau sudah kedaluwarsa.</p>
        </header>
        <a class="btn btn-primary" href="forgot-password.html"><span class="btn-label">Minta link baru</span></a>

      </section>
    </main>
    <footer class="mt-8 max-w-[420px] text-center text-xs text-muted">
      <p>Untuk tenaga kesehatan. Data Anda terlindungi dan hanya bisa diakses oleh Anda.</p>
    </footer>
  </div>
</body>
</html>
