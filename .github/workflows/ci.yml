name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cek sintaks semua file JS
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

  check-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cek src/href dan import lokal
        run: node .github/scripts/check-refs.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Jalankan unit test (node --test, tanpa dependensi tambahan)
        run: node --test "tests/**/*.test.mjs"
