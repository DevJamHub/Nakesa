<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Menyelesaikan proses masuk ke NAKESA.">
  <meta name="theme-color" content="#173a5e">
  <title>Sedang masuk — NAKESA</title>
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/pages/callback.js"></script>
</head>
<body>
  <div class="page-loader" id="loader" role="status" aria-label="Memuat">
    <span class="spinner"></span>
  </div>
  <div class="auth-page" id="content" hidden>
    <main class="auth-main">
      <a class="logo" href="index.html" aria-label="Beranda NAKESA">
          <svg width="32" height="32" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><rect width="56" height="56" rx="16" fill="currentColor"/><path d="M23 13h10v10h10v10H33v10H23V33H13V23h10z" fill="#fff"/></svg>
          <span class="logo-text">NAKESA</span>
        </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <header class="auth-header">
          <h1 id="auth-title">Gagal masuk</h1>
        </header>
        <div class="stack">
          <div class="alert alert-error" role="alert" id="callback-error">Proses masuk tidak berhasil. Silakan coba lagi.</div>
          <a class="btn btn-primary" href="login.html"><span class="btn-label">Kembali ke Masuk</span></a>
        </div>
      </section>
    </main>
    <footer class="auth-footer">
      <p>Untuk tenaga kesehatan. Data Anda terlindungi dan hanya bisa diakses oleh Anda.</p>
    </footer>
  </div>
</body>
</html>
