<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to NAKESA.">
  <meta name="theme-color" content="#173a5e">
  <title>Log In — NAKESA</title>
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <div class="auth-page">
    <main class="auth-main">
      <a class="logo" href="index.html" aria-label="NAKESA home">
          <svg width="32" height="32" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><rect width="56" height="56" rx="16" fill="currentColor"/><path d="M23 13h10v10h10v10H33v10H23V33H13V23h10z" fill="#fff"/></svg>
          <span class="logo-text">NAKESA</span>
        </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <header class="auth-header">
          <h1 id="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Log in to continue to NAKESA.</p>
        </header>

        <div class="stack">
          <div id="alert" hidden></div>
          <div class="stack-sm" data-requires="oauth">
            <button type="button" class="btn btn-google" data-oauth="google" data-provider="google">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 48 48" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
              <span class="btn-label">Continue with Google</span>
            </button>
            <button type="button" class="btn btn-apple" data-oauth="apple" data-provider="apple">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-icon" aria-hidden="true"><svg width="17" height="20" viewBox="0 0 384 512" focusable="false"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></span>
              <span class="btn-label">Continue with Apple</span>
            </button>
          </div>
          <div class="divider" role="separator" data-requires="both"><span>or</span></div>
          <form id="login-form" class="stack" novalidate data-provider="email">
              <div class="field">
                <label for="email">Email</label>
                <div class="field-control">
                  <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" aria-describedby="email-error" required inputmode="email">
                </div>
                <p class="field-error" id="email-error" hidden></p>
              </div>
              <div class="field">
                <label for="password">Password</label>
                <div class="field-control has-toggle">
                  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-error" required>
                  <button type="button" class="field-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <p class="field-error" id="password-error" hidden></p>
              </div>
            <div class="form-row-end"><a class="text-link" href="forgot-password.html">Forgot password?</a></div>
            <button type="submit" class="btn btn-primary" id="submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">Log In</span>
              </button>
          </form>
        </div>

        <p class="auth-switch">Don&apos;t have an account? <a href="signup.html">Create Account</a></p>
      </section>
    </main>
    <footer class="auth-footer">
      <p>For healthcare professionals. Your data is protected and access-controlled.</p>
    </footer>
  </div>
</body>
</html>
