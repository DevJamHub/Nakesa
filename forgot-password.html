<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your NAKESA password.">
  <meta name="theme-color" content="#173a5e">
  <title>Reset Password — NAKESA</title>
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/pages/forgot-password.js"></script>
</head>
<body>
  <div class="auth-page">
    <main class="auth-main">
      <a class="logo" href="index.html" aria-label="NAKESA home">
          <svg width="32" height="32" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><rect width="56" height="56" rx="16" fill="currentColor"/><path d="M23 13h10v10h10v10H33v10H23V33H13V23h10z" fill="#fff"/></svg>
          <span class="logo-text">NAKESA</span>
        </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <header class="auth-header">
          <h1 id="auth-title">Reset your password</h1>
          <p class="auth-subtitle">Enter your email and we&apos;ll send you a link to set a new password.</p>
        </header>

        <form id="forgot-form" class="stack" novalidate>
          <div id="alert" hidden></div>
              <div class="field">
                <label for="email">Email</label>
                <div class="field-control">
                  <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" aria-describedby="email-error" required inputmode="email">
                </div>
                <p class="field-error" id="email-error" hidden></p>
              </div>
          <button type="submit" class="btn btn-primary" id="submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">Send Reset Link</span>
              </button>
        </form>

        <div class="stack" id="sent-panel" hidden>
          <!-- Same message whether or not the account exists, so registered emails aren't revealed. -->
          <div class="alert alert-success" role="status">If an account exists for <strong id="sent-email"></strong>, you&apos;ll receive a password reset link shortly.</div>
          <a class="btn btn-secondary" href="login.html"><span class="btn-label">Back to Log In</span></a>
        </div>

        <p class="auth-switch">Remembered it? <a href="login.html">Log In</a></p>
      </section>
    </main>
    <footer class="auth-footer">
      <p>For healthcare professionals. Your data is protected and access-controlled.</p>
    </footer>
  </div>
</body>
</html>
