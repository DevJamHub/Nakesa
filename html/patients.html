<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Daftar pasien NAKESA.">
  <meta name="theme-color" content="#173a5e">
  <title>Pasien — NAKESA</title>
  <link rel="stylesheet" href="../css/app.css">
  <script type="module" src="../js/pages/patients.js"></script>
</head>
<body class="app">
  <div class="app-loader" id="loader" role="status" aria-label="Memuat"><span class="spinner"></span></div>
  <header class="app-header" id="app-header" hidden></header>
  <nav class="app-nav" id="app-nav" aria-label="Menu utama" hidden></nav>

  <main class="app-main" id="app-main" hidden>
    <div class="page-head">
      <div>
        <h1>Daftar Pasien</h1>
        <p id="patient-count"></p>
      </div>
      <button type="button" class="btn btn-primary" id="add">＋ Tambah Pasien</button>
    </div>

    <div class="search" style="margin-bottom:14px">
      <input class="input" type="search" id="search" placeholder="Cari nama atau nomor HP…" aria-label="Cari pasien">
    </div>

    <div class="list" id="list"></div>
  </main>

  <dialog id="patient-dialog" aria-labelledby="dialog-title">
    <form class="dialog-form" id="patient-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">Tambah Pasien</h2>
        <button type="button" class="dialog-close" data-close aria-label="Tutup">✕</button>
      </div>
      <div id="form-error" class="form-error" role="alert" hidden></div>

      <div class="field">
        <label for="full_name">Nama lengkap *</label>
        <input class="input" id="full_name" name="full_name" maxlength="120" required>
      </div>
      <div class="field">
        <span class="field-label">Jenis kelamin</span>
        <div class="segmented">
          <label class="choice"><input type="radio" name="gender" value="P"><span>👩 Perempuan</span></label>
          <label class="choice"><input type="radio" name="gender" value="L"><span>👨 Laki-laki</span></label>
        </div>
      </div>
      <div class="two-cols">
        <div class="field">
          <label for="birth_date">Tanggal lahir</label>
          <input class="input" id="birth_date" name="birth_date" type="date">
        </div>
        <div class="field">
          <label for="phone">No. HP / WA</label>
          <input class="input" id="phone" name="phone" type="tel" inputmode="tel" maxlength="30">
        </div>
      </div>
      <div class="field">
        <label for="address">Alamat</label>
        <input class="input" id="address" name="address" maxlength="300">
      </div>
      <div class="field">
        <label for="notes">Catatan</label>
        <textarea class="input" id="notes" name="notes" maxlength="2000" rows="3" placeholder="Riwayat, alergi, hasil periksa terakhir…"></textarea>
      </div>

      <div class="dialog-actions">
        <button type="submit" class="btn btn-primary btn-big" id="save">Simpan</button>
        <button type="button" class="btn btn-danger-ghost" id="delete" hidden>Hapus pasien</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
