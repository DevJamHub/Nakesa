<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose a new password for your NAKESA account.">
  <meta name="theme-color" content="#173a5e">
  <title>Set New Password — NAKESA</title>
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/pages/reset-password.js"></script>
</head>
<body>
  <div class="page-loader" id="loader" role="status" aria-label="Loading">
    <span class="spinner"></span>
  </div>
  <div class="auth-page" id="content" hidden>
    <main class="auth-main">
      <a class="logo" href="index.html" aria-label="NAKESA home">
          <svg width="32" height="32" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><rect width="56" height="56" rx="16" fill="currentColor"/><path d="M23 13h10v10h10v10H33v10H23V33H13V23h10z" fill="#fff"/></svg>
          <span class="logo-text">NAKESA</span>
        </a>
      <section class="auth-card" id="reset-card" aria-labelledby="auth-title" hidden>
        <header class="auth-header">
          <h1 id="auth-title">Set a new password</h1>
          <p class="auth-subtitle">Choose a new password for your NAKESA account.</p>
        </header>
        <form id="reset-form" class="stack" novalidate>
          <div id="alert" hidden></div>
              <div class="field">
                <label for="password">New Password</label>
                <div class="field-control has-toggle">
                  <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a new password" aria-describedby="password-error password-hint" required>
                  <button type="button" class="field-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <p class="field-hint" id="password-hint">At least 8 characters.</p>
                <p class="field-error" id="password-error" hidden></p>
              </div>
              <div class="field">
                <label for="confirm">Confirm Password</label>
                <div class="field-control has-toggle">
                  <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Confirm your new password" aria-describedby="confirm-error" required>
                  <button type="button" class="field-toggle" aria-controls="confirm" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <p class="field-error" id="confirm-error" hidden></p>
              </div>
          <button type="submit" class="btn btn-primary" id="submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">Update Password</span>
              </button>
        </form>
      </section>

      <section class="auth-card" id="expired-card" aria-labelledby="expired-title" hidden>
        <header class="auth-header">
          <h1 id="expired-title">Link expired</h1>
          <p class="auth-subtitle">This password reset link is invalid or has expired.</p>
        </header>
        <a class="btn btn-primary" href="forgot-password.html"><span class="btn-label">Request a new link</span></a>
      </section>
    </main>
    <footer class="auth-footer">
      <p>For healthcare professionals. Your data is protected and access-controlled.</p>
    </footer>
  </div>
</body>
</html>
