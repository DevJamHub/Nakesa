<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pengaturan praktik NAKESA.">
  <meta name="theme-color" content="#faf9f5">
  <title>Praktik — NAKESA</title>
  <script src="../js/theme.js"></script> <!-- light/dark before the page is drawn -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-setup.js"></script> <!-- shared Tailwind config + components -->
  <script type="module" src="../js/pages/practice.js"></script>
</head>
<body class="app">
  <div class="app-loader" id="loader" role="status" aria-label="Memuat"><span class="spinner"></span></div>
  <header class="app-header" id="app-header" hidden></header>
  <nav class="app-nav" id="app-nav" aria-label="Menu utama" hidden></nav>

  <main class="app-main" id="app-main" hidden>
    <div class="mb-7">
      <div class="mb-3 text-5xl leading-none" aria-hidden="true">🏥</div>
      <h1>Praktik Saya</h1>
      <p class="mt-1 text-muted">Status, jadwal, booking online, dan data praktik.</p>
    </div>

    <!-- Open / closed -->
    <section class="card" aria-labelledby="status-title">
      <label class="switch">
        <span>
          <strong class="text-lg font-semibold text-ink" id="status-title"></strong>
          <span class="block text-sm text-muted">Pasien melihat status ini di halaman booking.</span>
        </span>
        <input type="checkbox" id="open-toggle">
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>

    <!-- Laptop: schedule on the left, booking link and practice data on the right -->
    <div class="mt-8 grid items-start gap-8 lg:grid-cols-2">
    <!-- Weekly schedule -->
    <section class="card" aria-labelledby="hours-title">
      <div class="mb-4 grid gap-1">
        <h2 id="hours-title">🕒 Jadwal praktik</h2>
        <p class="text-sm text-muted">Nyalakan hari praktik dan isi jamnya. Bisa lebih dari satu sesi (misal pagi dan sore).</p>
      </div>
      <div id="days"></div>
      <p class="dirty-note" id="hours-dirty" role="status" hidden>● Ada perubahan jadwal yang belum disimpan</p>
      <div id="hours-error" class="form-error mt-2.5" role="alert" hidden></div>
      <button type="button" class="btn btn-primary btn-block mt-4" id="save-hours">Simpan Jadwal</button>
    </section>

    <div class="grid gap-8">
    <!-- Online booking -->
    <section class="card grid gap-4" aria-labelledby="booking-title">
      <label class="switch">
        <span>
          <strong class="text-lg font-semibold text-ink" id="booking-title">🌐 Terima booking online</strong>
          <span class="block text-sm text-muted">Pasien bisa daftar sendiri lewat link di bawah.</span>
        </span>
        <input type="checkbox" id="booking-toggle">
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <code class="link-box" id="booking-link"></code>
      <div class="two-cols">
        <button type="button" class="btn btn-ghost" id="copy-link">📋 Salin link</button>
        <a class="btn btn-ghost" id="open-link" target="_blank" rel="noopener">👀 Lihat halaman</a>
      </div>
    </section>

    <!-- Practice info -->
    <section class="card" aria-labelledby="info-title">
      <h2 class="mb-4" id="info-title">🏥 Data praktik</h2>
      <form id="info-form" class="grid gap-4" novalidate>
        <div id="info-error" class="form-error" role="alert" hidden></div>
        <div class="field">
          <label for="practice_name">Nama praktik *</label>
          <input class="input" id="practice_name" name="name" maxlength="120" required>
        </div>
        <div class="field">
          <label for="profession">Profesi</label>
          <select class="input" id="profession" name="profession"></select>
        </div>
        <div class="field" id="specialty-field" hidden>
          <label for="specialty" id="specialty-label"></label>
          <input class="input" id="specialty" name="specialty" maxlength="120">
        </div>
        <div class="field">
          <label for="phone">No. WhatsApp praktik</label>
          <input class="input" id="phone" name="phone" type="tel" inputmode="tel" maxlength="30">
        </div>
        <div class="field">
          <label for="address">Alamat</label>
          <textarea class="input" id="address" name="address" maxlength="300" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="save-info">Simpan Data Praktik</button>
      </form>
    </section>
    </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
