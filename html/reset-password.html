<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat kata sandi baru untuk akun NAKESA Anda.">
  <meta name="theme-color" content="#173a5e">
  <title>Kata Sandi Baru — NAKESA</title>
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/pages/reset-password.js"></script>
</head>
<body>
  <div class="page-loader" id="loader" role="status" aria-label="Memuat">
    <span class="spinner"></span>
  </div>
  <div class="auth-page" id="content" hidden>
    <main class="auth-main">
      <a class="logo" href="index.html" aria-label="Beranda NAKESA">
          <svg width="32" height="32" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><rect width="56" height="56" rx="16" fill="currentColor"/><path d="M23 13h10v10h10v10H33v10H23V33H13V23h10z" fill="#fff"/></svg>
          <span class="logo-text">NAKESA</span>
        </a>
      <section class="auth-card" id="reset-card" aria-labelledby="auth-title" hidden>
        <header class="auth-header">
          <h1 id="auth-title">Buat kata sandi baru</h1>
          <p class="auth-subtitle">Buat kata sandi baru untuk akun NAKESA Anda.</p>
        </header>
        <form id="reset-form" class="stack" novalidate>
          <div id="alert" hidden></div>
              <div class="field">
                <label for="password">Kata sandi baru</label>
                <div class="field-control has-toggle">
                  <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Buat kata sandi baru" aria-describedby="password-error password-hint" required>
                  <button type="button" class="field-toggle" aria-controls="password" aria-pressed="false" aria-label="Tampilkan kata sandi">Lihat</button>
                </div>
                <p class="field-hint" id="password-hint">Minimal 8 karakter.</p>
                <p class="field-error" id="password-error" hidden></p>
              </div>
              <div class="field">
                <label for="confirm">Ulangi kata sandi</label>
                <div class="field-control has-toggle">
                  <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Ketik ulang kata sandi baru" aria-describedby="confirm-error" required>
                  <button type="button" class="field-toggle" aria-controls="confirm" aria-pressed="false" aria-label="Tampilkan kata sandi">Lihat</button>
                </div>
                <p class="field-error" id="confirm-error" hidden></p>
              </div>
          <button type="submit" class="btn btn-primary" id="submit">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">Simpan Kata Sandi</span>
              </button>
        </form>
      </section>

      <section class="auth-card" id="expired-card" aria-labelledby="expired-title" hidden>
        <header class="auth-header">
          <h1 id="expired-title">Link kedaluwarsa</h1>
          <p class="auth-subtitle">Link ini tidak valid atau sudah kedaluwarsa.</p>
        </header>
        <a class="btn btn-primary" href="forgot-password.html"><span class="btn-label">Minta link baru</span></a>
      </section>
    </main>
    <footer class="auth-footer">
      <p>Untuk tenaga kesehatan. Data Anda terlindungi dan hanya bisa diakses oleh Anda.</p>
    </footer>
  </div>
</body>
</html>
