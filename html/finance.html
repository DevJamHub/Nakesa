<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Catatan keuangan praktik NAKESA.">
  <meta name="theme-color" content="#faf9f5">
  <title>Keuangan — NAKESA</title>
  <script src="../js/theme.js"></script> <!-- light/dark before the page is drawn -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-setup.js"></script> <!-- shared Tailwind config + components -->
  <script type="module" src="../js/pages/finance.js"></script>
  <script type="module" src="../js/tailwind-highlight.js"></script> <!-- ?tailwind: highlight Tailwind parts -->
</head>
<body class="app">
  <div class="app-loader" id="loader" role="status" aria-label="Memuat"><span class="spinner"></span></div>
  <header class="app-header" id="app-header" hidden></header>
  <nav class="app-nav" id="app-nav" aria-label="Menu utama" hidden></nav>

  <main class="app-main" id="app-main" hidden>
    <div class="mb-7">
      <div class="mb-3 text-5xl leading-none" aria-hidden="true">💰</div>
      <h1>Catatan Keuangan</h1>
      <p class="mt-1 text-muted" id="subjudul">Uang masuk dan keluar praktik.</p>
    </div>

    <div class="mb-4 flex items-center justify-between gap-2.5">
      <button type="button" class="btn btn-ghost btn-small" id="prev-month" aria-label="Bulan sebelumnya">◀</button>
      <strong class="font-serif text-xl font-semibold text-ink" id="month-label"></strong>
      <button type="button" class="btn btn-ghost btn-small" id="next-month" aria-label="Bulan berikutnya">▶</button>
    </div>

    <!-- Amounts shrink a little on narrow phones instead of running past the card edge. -->
    <div class="grid grid-cols-[repeat(auto-fit,minmax(160px,1fr))] gap-3">
      <div class="stat"><span class="stat-label">Uang masuk</span><span class="stat-value text-[clamp(1.2rem,5.2vw,1.65rem)] !text-green" id="sum-in">–</span></div>
      <div class="stat"><span class="stat-label">Uang keluar</span><span class="stat-value text-[clamp(1.2rem,5.2vw,1.65rem)] !text-red" id="sum-out">–</span></div>
      <div class="stat"><span class="stat-label">Sisa (untung)</span><span class="stat-value text-[clamp(1.2rem,5.2vw,1.65rem)]" id="sum-balance">–</span></div>
    </div>

    <!-- US 6.4: money in / out of the last 6 months. Bars are drawn by js/pages/finance.js. -->
    <section class="card mt-3 grid gap-2 p-4" aria-labelledby="trend-title">
      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1.5">
        <div>
          <h2 class="text-base" id="trend-title">Tren 6 Bulan</h2>
          <p class="text-xs text-muted">Ketuk salah satu bulan untuk membukanya.</p>
        </div>
        <div class="flex items-center gap-3 text-xs text-muted">
          <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-chart-in" aria-hidden="true"></span>Uang masuk</span>
          <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-chart-out" aria-hidden="true"></span>Uang keluar</span>
        </div>
      </div>
      <div class="transition-opacity" id="trend-chart"></div>
      <p class="flex min-h-[2.75rem] flex-wrap items-center gap-x-3 gap-y-0.5 text-sm leading-snug text-muted sm:min-h-[1.5rem]"
        id="trend-readout"></p>
    </section>

    <button type="button" class="btn btn-ghost btn-block mt-3" id="toggle-breakdown"
      aria-expanded="false" aria-controls="breakdown">📊 Lihat Rincian per Kategori</button>
    <div class="card mt-2.5 grid gap-1.5" id="breakdown" hidden></div>

    <div class="two-cols mt-4">
      <button type="button" class="btn btn-success btn-big" data-new="masuk">＋ Uang Masuk</button>
      <button type="button" class="btn btn-danger btn-big" data-new="keluar">− Uang Keluar</button>
    </div>

    <div class="search mt-4">
      <input class="input" type="search" id="search" placeholder="Cari catatan, misal: Bu Ani, Beli Obat…" aria-label="Cari catatan keuangan">
    </div>

    <div class="filter-chips mb-0 mt-3" id="kind-filter" role="group" aria-label="Saring jenis">
      <button type="button" class="chip" data-kind="all" aria-pressed="true">Semua</button>
      <button type="button" class="chip" data-kind="masuk" aria-pressed="false">＋ Uang Masuk</button>
      <button type="button" class="chip" data-kind="keluar" aria-pressed="false">− Uang Keluar</button>
    </div>

    <div class="mt-2" id="list"></div>
  </main>

  <dialog id="tx-dialog" aria-labelledby="dialog-title">
    <form class="dialog-form" id="tx-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">Catat Uang</h2>
        <button type="button" class="dialog-close" data-close aria-label="Tutup">✕</button>
      </div>
      <div id="form-error" class="form-error" role="alert" hidden></div>

      <div class="segmented" role="radiogroup" aria-label="Jenis">
        <label class="choice choice-in"><input type="radio" name="kind" value="masuk"><span>＋ Masuk</span></label>
        <label class="choice choice-out"><input type="radio" name="kind" value="keluar"><span>− Keluar</span></label>
      </div>
      <div class="field">
        <label for="amount">Jumlah (Rp) *</label>
        <input class="input input-money" id="amount" name="amount" inputmode="numeric" placeholder="0" autocomplete="off" required>
      </div>
      <div class="field">
        <span class="field-label">Untuk apa?</span>
        <div class="choices" id="category-choices"></div>
      </div>
      <div class="field">
        <label for="occurred_on">Tanggal</label>
        <input class="input" id="occurred_on" name="occurred_on" type="date">
      </div>
      <div class="field">
        <label for="note">Catatan</label>
        <input class="input" id="note" name="note" maxlength="300" placeholder="Contoh: Bu Ani, periksa kehamilan">
      </div>

      <div class="dialog-actions">
        <button type="submit" class="btn btn-primary btn-big" id="save">Simpan</button>
        <button type="button" class="btn btn-danger-ghost" id="delete" hidden>Hapus catatan</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
