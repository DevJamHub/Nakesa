<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Booking janji periksa secara online.">
  <meta name="theme-color" content="#faf9f5">
  <title>Booking Online — NAKESA</title>
  <script src="../js/theme.js"></script> <!-- light/dark before the page is drawn -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/tailwind-setup.js"></script> <!-- shared Tailwind config + components -->
  <script type="module" src="../js/pages/book.js"></script>
</head>
<body>
  <button type="button" class="icon-btn theme-toggle theme-fab" data-theme-toggle></button>
  <div class="app-loader" id="loader" role="status" aria-label="Memuat"><span class="spinner"></span></div>

  <main class="public" id="app-main" hidden>
    <!-- Practice -->
    <section class="card grid gap-4" aria-labelledby="practice-name">
      <div class="flex items-center gap-3.5">
        <span class="grid h-14 w-14 shrink-0 place-items-center rounded-xl bg-raised text-3xl" id="practice-icon" aria-hidden="true"></span>
        <div class="min-w-0">
          <h1 class="text-2xl" id="practice-name"></h1>
          <p class="text-muted" id="practitioner"></p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2.5">
        <span class="open-pill" id="open-pill"></span>
        <span class="text-sm text-muted" id="address"></span>
      </div>
      <details class="rounded-lg bg-raised px-3.5 py-2.5" id="hours-box">
        <summary class="font-semibold text-accent-ink">🕒 Lihat jadwal praktik</summary>
        <table class="hours mt-2"><tbody id="hours"></tbody></table>
      </details>
      <a class="btn btn-wa" id="contact" target="_blank" rel="noopener" hidden>💬 Chat praktik via WhatsApp</a>
    </section>

    <!-- Booking form -->
    <section class="card" id="form-card" aria-labelledby="form-title">
      <h2 class="mb-4" id="form-title">📅 Buat janji periksa</h2>
      <form id="book-form" class="grid gap-4" novalidate>
        <div id="form-error" class="form-error" role="alert" hidden></div>
        <div class="field">
          <label for="name">Nama pasien *</label>
          <input class="input" id="name" name="p_name" autocomplete="name" maxlength="120" required>
        </div>
        <div class="field">
          <label for="phone">Nomor WhatsApp *</label>
          <input class="input" id="phone" name="p_phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="0812xxxxxxx" required>
          <p class="field-hint">Praktik akan mengonfirmasi lewat nomor ini.</p>
        </div>
        <div class="two-cols">
          <div class="field">
            <label for="date">Tanggal *</label>
            <input class="input" id="date" name="p_date" type="date" required>
          </div>
          <div class="field">
            <label for="time">Jam (opsional)</label>
            <input class="input" id="time" name="p_time" type="time">
          </div>
        </div>
        <p class="field-hint" id="date-hint"></p>
        <div class="field">
          <span class="field-label">Layanan</span>
          <div class="choices" id="services"></div>
        </div>
        <div class="field">
          <label for="complaint">Keluhan (opsional)</label>
          <textarea class="input" id="complaint" name="p_complaint" maxlength="500" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-big" id="submit">Kirim Booking</button>
      </form>
    </section>

    <!-- Closed for online booking -->
    <section class="card empty-state" id="disabled-card" hidden>
      <p class="empty-icon" aria-hidden="true">📵</p>
      <p>Booking online sedang ditutup. Silakan hubungi praktik langsung.</p>
    </section>

    <!-- Done -->
    <section class="card empty-state" id="success-card" hidden>
      <p class="success-icon" aria-hidden="true">✅</p>
      <h2>Booking terkirim!</h2>
      <p class="text-muted" id="success-text"></p>
      <a class="btn btn-wa" id="success-wa" target="_blank" rel="noopener" hidden>💬 Kabari praktik via WhatsApp</a>
    </section>

    <p class="text-center text-sm text-muted">Dibuat dengan <span class="font-serif font-semibold text-ink">NAKESA</span> <span class="text-accent">✻</span></p>
  </main>
</body>
</html>
