<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAKESA</title>
  <script>
    // All pages live in /html. If Supabase sends a sign-in result here
    // (?code= or #error=), pass it on to the callback page.
    var hasAuthResult = /[?&#](code|error)=/.test(location.search + location.hash);
    location.replace((hasAuthResult ? 'html/callback.html' : 'html/index.html') + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="1; url=html/index.html">
</head>
<body>
  <a href="html/index.html">Buka NAKESA</a>
</body>
</html>
